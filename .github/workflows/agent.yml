name: Instagram agent

on:
  schedule:
    - cron: "30 4 * * 0"    # Sunday 10:00 IST: plan next week + weekly report
    - cron: "7,37 * * * *"  # every 30 min (off the busy :00): publish approved posts that are due
    - cron: "15 */3 * * *"  # every 3 hours: draft replies to new comments
  workflow_dispatch:
    inputs:
      command:
        description: "What should the agent do?"
        type: choice
        options: [plan, approve-all, publish-due, comments, send-replies, report, approve, reject, youtube-check, x-check, voice-test, revoice, voice-samples]
        default: plan
      post_id:
        description: "Post id (only for approve / reject / voice-test of a single post)"
        required: false

permissions:
  contents: write

concurrency:
  # Publish runs may wait for a post's exact time, so they queue separately
  # and don't hold up planning, comments or approvals.
  group: instagram-agent-${{ github.event.schedule == '7,37 * * * *' && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
      POSTS_PER_WEEK: ${{ vars.POSTS_PER_WEEK || '5' }}
      AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'false' }}
      HANDLE: ${{ vars.HANDLE }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
      VOICE: ${{ vars.VOICE }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest queue, not the commit the run was scheduled on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pick commands
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          COMMAND: ${{ inputs.command }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          case "$SCHEDULE" in
            "30 4 * * 0")   echo "cmds=report plan" >> "$GITHUB_OUTPUT" ;;
            "7,37 * * * *") echo "cmds=publish-due" >> "$GITHUB_OUTPUT"
                            echo "lookahead=240" >> "$GITHUB_OUTPUT" ;;
            "15 */3 * * *") echo "cmds=comments" >> "$GITHUB_OUTPUT" ;;
            *)              echo "cmds=$COMMAND" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "post_id=$POST_ID" >> "$GITHUB_OUTPUT"

      - name: Run agent
        env:
          CMDS: ${{ steps.pick.outputs.cmds }}
          POST_ID: ${{ steps.pick.outputs.post_id }}
          PUBLISH_LOOKAHEAD_MIN: ${{ steps.pick.outputs.lookahead }}
        run: |
          for cmd in $CMDS; do
            echo "::group::$cmd"
            if [ "$cmd" = approve ] || [ "$cmd" = reject ] || [ "$cmd" = voice-test ]; then
              python -m agent "$cmd" "$POST_ID"
            else
              python -m agent "$cmd"
            fi
            echo "::endgroup::"
          done

      - name: Save changes to the repo
        run: |
          git config user.name "insta-agent"
          git config user.email "insta-agent@users.noreply.github.com"
          git add queue replies reports media ideas
          git diff --cached --quiet || git commit -m "agent: ${{ steps.pick.outputs.cmds }}"
          git pull --rebase origin main
          git push
